name: CI & Deploy (GitHub Pages)

# CI on every push/PR to main (build + unit tests); CD deploys to GitHub Pages
# only on push to main, and only after the build-and-test job passes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sred-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sred-dashboard/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy from main pushes, and only if build-test passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: sred-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sred-dashboard/package-lock.json
      - run: npm ci
      - name: Build (production, base-href for project Pages)
        run: npx ng build --base-href "/sred-task-ui/"
      - name: SPA deep-link fallback + disable Jekyll
        # GitHub Pages is static: serve index.html for unknown routes so the Angular
        # router handles deep links / refresh; .nojekyll keeps all files as-is.
        run: |
          cp dist/sred-dashboard/browser/index.html dist/sred-dashboard/browser/404.html
          touch dist/sred-dashboard/browser/.nojekyll
      - name: Configure Pages
        # Pages must be enabled once in Settings → Pages → Source: "GitHub Actions".
        # This step then reads that configuration (it does not create the site).
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sred-dashboard/dist/sred-dashboard/browser
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
