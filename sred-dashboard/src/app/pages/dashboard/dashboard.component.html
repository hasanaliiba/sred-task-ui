<!-- Metric toggle (drives Analytics) + period selector — sticky under the shell top bar -->
<div class="sticky top-16 z-10 bg-gray-50/90 backdrop-blur border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <app-metric-toggle></app-metric-toggle>
    <div class="flex flex-wrap items-center gap-3">
      <app-period-selector></app-period-selector>
      <app-date-range-picker></app-date-range-picker>
    </div>
  </div>
</div>

<main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
  <!-- Client header (Req 1) -->
  <section appReveal>
    <app-client-header></app-client-header>
  </section>

  <!-- Metric-aware period tiles — quick-pick by quarter or month (P2.5) -->
  <section appReveal>
    <app-summary-tiles></app-summary-tiles>
  </section>

  <!-- Year projection — headline KPIs + gauge (Req 6) -->
  <section appReveal>
    <app-year-projection></app-year-projection>
  </section>

  <!-- Employee charts (Feature H) -->
  <section appReveal class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <app-employee-hours-chart></app-employee-hours-chart>
    <app-employee-hour-and-cost-chart></app-employee-hour-and-cost-chart>
  </section>

  <!-- Teams (Feature D + H) -->
  <section appReveal class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <app-teams-table></app-teams-table>
    <app-team-hours-chart></app-team-hours-chart>
  </section>

  <!-- Per-project chart (Req 4) -->
  <section appReveal>
    <app-project-chart></app-project-chart>
  </section>

  <!-- All-projects summary: grand totals + cost-share donut (Req 5) -->
  <section appReveal>
    <app-projects-summary></app-projects-summary>
  </section>
</main>
