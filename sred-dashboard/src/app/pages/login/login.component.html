<main class="min-h-screen bg-gradient-to-br from-ink via-brand-900 to-brand-700 flex items-center justify-center p-4">
  <div appReveal class="w-full max-w-md bg-white rounded-xl shadow-2xl p-8">
    <!-- Brand -->
    <div class="flex items-center gap-3 mb-6">
      <div class="h-10 w-10 rounded-xl bg-logo flex items-center justify-center text-white font-bold text-lg">S</div>
      <div>
        <h1 class="text-xl font-bold text-ink leading-tight">SR&amp;ED Dashboard</h1>
        <p class="text-xs text-gray-500">Sign in to your workspace</p>
      </div>
    </div>

    <!-- Error -->
    @if (error) {
      <div class="mb-4 rounded-lg bg-danger/10 text-danger text-sm px-4 py-3" role="alert">
        {{ error }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
      <div>
        <label for="username" class="block mb-1 text-sm font-medium text-gray-700">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          class="w-full rounded-lg border px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand-300 focus:border-brand-500 outline-none transition-colors"
          [class.border-danger]="usernameInvalid"
          [class.border-gray-300]="!usernameInvalid"
          placeholder="afiniti"
        />
        @if (usernameInvalid) {
          <p class="mt-1 text-xs text-danger">Username is required.</p>
        }
      </div>

      <div>
        <label for="password" class="block mb-1 text-sm font-medium text-gray-700">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-lg border px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand-300 focus:border-brand-500 outline-none transition-colors"
          [class.border-danger]="passwordInvalid"
          [class.border-gray-300]="!passwordInvalid"
          placeholder="••••••••"
        />
        @if (passwordInvalid) {
          <p class="mt-1 text-xs text-danger">Password is required.</p>
        }
      </div>

      <button
        type="submit"
        class="w-full text-white bg-brand-600 hover:bg-brand-700 focus:ring-4 focus:ring-brand-200 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors"
      >
        Sign in
      </button>
    </form>

    <!-- Demo credentials (take-home convenience) -->
    <div class="mt-6 border-t border-gray-100 pt-4">
      <p class="text-xs text-gray-400 mb-2">Demo logins (password: <span class="font-mono">sred2025</span>)</p>
      <div class="flex flex-wrap gap-2">
        <button type="button" (click)="quickLogin('afiniti')" class="text-xs rounded-full bg-brand-50 text-brand-700 px-3 py-1 hover:bg-brand-100 transition-colors">afiniti</button>
        <button type="button" (click)="quickLogin('salesflo')" class="text-xs rounded-full bg-brand-50 text-brand-700 px-3 py-1 hover:bg-brand-100 transition-colors">salesflo</button>
        <button type="button" (click)="quickLogin('admin')" class="text-xs rounded-full bg-ink/10 text-ink px-3 py-1 hover:bg-ink/20 transition-colors">admin</button>
      </div>
    </div>
  </div>
</main>
