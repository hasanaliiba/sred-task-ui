@if (client$ | async; as client) {
  <div class="bg-gradient-to-br from-ink to-brand-800 text-white rounded-xl shadow-lg px-5 py-4">
    <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-4">
      <!-- Identity -->
      <h1 class="min-w-0 truncate text-2xl font-extrabold leading-tight">{{ client.name }}</h1>

      <!-- Reporting meta — label/value blocks separated by thin dividers -->
      <dl class="flex items-center divide-x divide-white/15">
        <div class="px-4 first:pl-0 last:pr-0">
          <dt class="flex items-center gap-1.5 text-[10px] font-medium uppercase tracking-wider text-white/50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-3.5 w-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
            </svg>
            Fiscal year
          </dt>
          <dd class="mt-1 whitespace-nowrap text-sm font-semibold">
            {{ client.fiscalYearStart | date: 'MMM d, y' : 'UTC' }} – {{ client.fiscalYearEnd | date: 'MMM d, y' : 'UTC' }}
          </dd>
        </div>

        <div class="px-4 first:pl-0 last:pr-0">
          <dt class="flex items-center gap-1.5 text-[10px] font-medium uppercase tracking-wider text-white/50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-3.5 w-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            Data as of
          </dt>
          <dd class="mt-1 whitespace-nowrap text-sm font-semibold">{{ client.asOfDate | date: 'MMM d, y' : 'UTC' }}</dd>
        </div>

        <div class="px-4 first:pl-0 last:pr-0">
          <dt class="flex items-center gap-1.5 text-[10px] font-medium uppercase tracking-wider text-white/50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-3.5 w-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-18c2.486 0 4.5 4.03 4.5 9s-2.014 9-4.5 9-4.5-4.03-4.5-9 2.014-9 4.5-9ZM3 12h18" />
            </svg>
            Time zone
          </dt>
          <dd class="mt-1 text-sm font-semibold">{{ client.timeZone }}</dd>
        </div>
      </dl>
    </div>
  </div>
}
