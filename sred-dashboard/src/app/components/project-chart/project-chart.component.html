<div class="bg-white rounded-xl shadow ring-1 ring-gray-100 p-6">
  <div class="mb-2">
    <h2 class="text-lg font-bold text-ink">Hours &amp; Cost by Project</h2>
    <p class="text-sm text-gray-400">Each column is a project, stacked by employee hours; the project's total cost is under its name. Hover a block for that employee's hours + cost.</p>
  </div>

  @if (vm$ | async; as vm) {
    @if (vm.empty) {
      <p class="py-8 text-sm text-gray-400 text-center">No projects to display.</p>
    } @else {
      <apx-chart
        class="block min-h-[420px]"
        [series]="vm.series"
        [chart]="chart"
        [xaxis]="vm.xaxis"
        [yaxis]="yaxis"
        [colors]="vm.colors"
        [plotOptions]="plotOptions"
        [dataLabels]="dataLabels"
        [legend]="legend"
        [tooltip]="tooltip"
      ></apx-chart>
    }
  }
</div>
