<!-- Per-project share of the active metric (SR&ED projects only) -->
@if (donut$ | async; as donut) {
  <div class="bg-white rounded-xl shadow ring-1 ring-gray-100 p-6">
    <h2 class="text-lg font-bold text-ink mb-2">{{ donut.metricLabel }} share by project</h2>
    @if (donut.empty) {
      <p class="py-8 text-sm text-gray-400 text-center">Nothing to display for this period.</p>
    } @else {
      <apx-chart
        [series]="donut.series"
        [labels]="donut.labels"
        [colors]="donut.colors"
        [chart]="chart"
        [plotOptions]="donut.plotOptions"
        [legend]="legend"
        [dataLabels]="dataLabels"
        [tooltip]="donut.tooltip"
      ></apx-chart>
    }
  </div>
}
