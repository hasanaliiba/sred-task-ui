<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <!-- Grand totals strip (count-up animated) -->
  @if (totals$ | async; as totals) {
    <div class="bg-gradient-to-br from-ink to-brand-800 text-white rounded-xl shadow-lg p-6 flex flex-col justify-center">
      <p class="text-xs uppercase tracking-wider text-white/50 mb-4">All projects · selected period</p>
      <div class="grid grid-cols-2 gap-6">
        <div>
          <p class="text-sm text-white/60">Total hours</p>
          <p class="text-3xl font-extrabold" [appCountUp]="totals.totalHours" [countUpSuffix]="' h'"></p>
        </div>
        <div>
          <p class="text-sm text-white/60">Total amount</p>
          <p class="text-3xl font-extrabold" [appCountUp]="totals.totalAmount" countUpPrefix="$"></p>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-6 mt-5 pt-4 border-t border-white/10 text-sm">
        <div>
          <p class="text-white/50">Labor <span class="text-white/40">(all projects)</span></p>
          <p class="font-semibold" [appCountUp]="totals.totalLaborAmount" countUpPrefix="$"></p>
        </div>
        <div>
          <p class="text-white/50">Vendor <span class="text-white/40">(all projects)</span></p>
          <p class="font-semibold" [appCountUp]="totals.totalVendorAmount" countUpPrefix="$"></p>
        </div>
      </div>
    </div>
  }

  <!-- Per-project share of the active metric -->
  @if (donut$ | async; as donut) {
    <div class="bg-white rounded-xl shadow ring-1 ring-gray-100 p-6">
      <h2 class="text-lg font-bold text-ink mb-2">{{ donut.metricLabel }} share by project</h2>
      @if (donut.empty) {
        <p class="py-8 text-sm text-gray-400 text-center">Nothing to display for this period.</p>
      } @else {
        <apx-chart
          [series]="donut.series"
          [labels]="donut.labels"
          [colors]="donut.colors"
          [chart]="chart"
          [plotOptions]="donut.plotOptions"
          [legend]="legend"
          [dataLabels]="dataLabels"
          [tooltip]="donut.tooltip"
        ></apx-chart>
      }
    </div>
  }
</div>
