<!-- Always present (even for a single page) for consistent grid chrome. -->
<div class="px-6 py-3 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500">
  <span>
    Showing <span class="font-medium text-gray-700">{{ start }}–{{ end }}</span>
    of <span class="font-medium text-gray-700">{{ total }}</span>
  </span>
  <div class="flex items-center gap-1">
    <button type="button" (click)="prev()" [disabled]="page === 1"
      class="px-3 py-1 rounded-lg border border-gray-200 disabled:text-gray-300 disabled:border-gray-100 hover:bg-gray-50 transition-colors">Prev</button>
    @for (p of visiblePages; track $index) {
      @if (p === '…') {
        <span class="px-1 text-gray-400">…</span>
      } @else {
        <button type="button" (click)="go(p)"
          class="px-3 py-1 rounded-lg transition-colors"
          [class.bg-brand-600]="p === page"
          [class.text-white]="p === page"
          [class.hover:bg-gray-100]="p !== page">{{ p }}</button>
      }
    }
    <button type="button" (click)="next()" [disabled]="page === pages"
      class="px-3 py-1 rounded-lg border border-gray-200 disabled:text-gray-300 disabled:border-gray-100 hover:bg-gray-50 transition-colors">Next</button>
  </div>
</div>
