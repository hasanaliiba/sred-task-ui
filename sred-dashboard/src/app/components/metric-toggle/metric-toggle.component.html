@if (current$ | async; as current) {
  <div class="inline-flex items-center gap-1 bg-gray-100 rounded-xl p-1 text-sm" role="group" aria-label="Metric">
    @for (opt of options; track opt.value) {
      <button
        type="button"
        (click)="select(opt.value)"
        [attr.aria-pressed]="current === opt.value"
        class="px-3 py-1 rounded-lg font-medium transition-colors"
        [class.bg-brand-600]="current === opt.value"
        [class.text-white]="current === opt.value"
        [class.shadow]="current === opt.value"
        [class.text-gray-600]="current !== opt.value"
        [class.hover:bg-gray-200]="current !== opt.value"
      >
        {{ opt.label }}
      </button>
    }
  </div>
}
