@if (current$ | async; as current) {
  <div class="inline-flex items-center gap-0.5 bg-gray-100 rounded-lg p-0.5 text-xs" role="group" aria-label="Metric">
    @for (opt of options; track opt.value) {
      <button
        type="button"
        (click)="select(opt.value)"
        [attr.aria-pressed]="current === opt.value"
        class="px-2.5 py-1 rounded-md font-semibold transition-colors"
        [class.bg-brand-600]="current === opt.value"
        [class.text-white]="current === opt.value"
        [class.shadow-sm]="current === opt.value"
        [class.text-gray-500]="current !== opt.value"
        [class.hover:text-gray-700]="current !== opt.value"
      >
        {{ opt.label }}
      </button>
    }
  </div>
}
