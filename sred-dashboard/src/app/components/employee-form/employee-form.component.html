<div class="fixed inset-0 z-50 overflow-y-auto">
  <div class="flex min-h-full items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/40" (click)="onCancel()"></div>

    <!-- Dialog: capped height, scrollable body, sticky footer -->
    <div class="relative w-full max-w-lg bg-white rounded-2xl shadow-2xl flex flex-col max-h-[90vh]"
      role="dialog" aria-modal="true">
      <div class="px-6 pt-6 pb-3 shrink-0">
        <h2 class="text-lg font-bold text-ink">{{ isEdit ? 'Edit employee' : 'Add employee' }}</h2>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col min-h-0 flex-1">
        <div class="px-6 pb-2 overflow-y-auto space-y-4">
          <div>
            <label for="emp-name" class="block mb-1 text-sm font-medium text-gray-700">Name</label>
            <input id="emp-name" type="text" formControlName="name"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-300 focus:border-brand-500 outline-none"
              [class.border-danger]="nameInvalid" />
            @if (nameInvalid) { <p class="mt-1 text-xs text-danger">Name is required.</p> }
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="emp-province" class="block mb-1 text-sm font-medium text-gray-700">Province</label>
              <select id="emp-province" formControlName="province"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-300 outline-none">
                @for (p of provinces; track p) { <option [value]="p">{{ p }}</option> }
              </select>
            </div>
            <div>
              <label for="emp-team" class="block mb-1 text-sm font-medium text-gray-700">Team</label>
              <select id="emp-team" formControlName="teamId"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-300 outline-none">
                <option value="">Unassigned</option>
                @for (t of teams; track t.id) { <option [value]="t.id">{{ t.name }}</option> }
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="emp-start" class="block mb-1 text-sm font-medium text-gray-700">Start date</label>
              <input id="emp-start" type="date" formControlName="startDate"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-300 outline-none" />
            </div>
            <div>
              <label for="emp-end" class="block mb-1 text-sm font-medium text-gray-700">End date <span class="text-gray-400">(optional)</span></label>
              <input id="emp-end" type="date" formControlName="endDate"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-300 outline-none" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="emp-expected" class="block mb-1 text-sm font-medium text-gray-700">Expected salary</label>
              <input id="emp-expected" type="number" min="0" formControlName="expectedSalary"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-300 outline-none" />
            </div>
            <div>
              <label for="emp-confirmed" class="block mb-1 text-sm font-medium text-gray-700">Confirmed salary</label>
              <input id="emp-confirmed" type="number" min="0" formControlName="confirmedSalary"
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-300 outline-none" />
            </div>
          </div>

          <label class="flex items-center gap-2 text-sm text-gray-700">
            <input type="checkbox" formControlName="isSpecialEmployee" class="rounded border-gray-300 text-brand-600 focus:ring-brand-300" />
            Specified employee
          </label>
        </div>

        <!-- Sticky footer -->
        <div class="px-6 py-4 border-t border-gray-100 shrink-0 flex justify-end gap-3 bg-white rounded-b-2xl">
          <button type="button" (click)="onCancel()"
            class="text-sm text-gray-600 hover:bg-gray-100 rounded-lg px-4 py-2 transition-colors">Cancel</button>
          <button type="submit"
            class="text-sm text-white bg-brand-600 hover:bg-brand-700 rounded-lg px-4 py-2 transition-colors">
            {{ isEdit ? 'Save changes' : 'Add employee' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
