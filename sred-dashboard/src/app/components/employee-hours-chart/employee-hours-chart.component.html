<div class="bg-white rounded-2xl shadow ring-1 ring-gray-100 p-6">
  <div class="mb-2">
    <h2 class="text-lg font-bold text-ink">Employee Hours</h2>
    <p class="text-sm text-gray-400">SR&amp;ED vs Unclaimed hours per employee (selected period).</p>
  </div>

  @if (vm$ | async; as vm) {
    @if (vm.categories.length === 0) {
      <p class="py-8 text-sm text-gray-400 text-center">No hours to display for this period.</p>
    } @else {
      <apx-chart
        [series]="vm.series"
        [chart]="chart"
        [xaxis]="vm.xaxis"
        [yaxis]="yaxis"
        [colors]="colors"
        [plotOptions]="plotOptions"
        [dataLabels]="dataLabels"
        [legend]="legend"
        [tooltip]="tooltip"
      ></apx-chart>
    }
  }
</div>
