<div class="h-full bg-gradient-to-b from-navy to-brand-900 text-white flex flex-col items-center">
  <!-- Brand -->
  <div class="h-16 w-full flex items-center justify-center shrink-0 border-b border-white/10">
    <img src="assets/images/logo.svg" alt="SR&amp;ED Dashboard logo" class="h-8 w-8 rounded-lg" />
  </div>

  <!-- Nav (icon-only rail; labels via tooltip) -->
  <nav class="flex-1 overflow-y-auto w-full py-4 flex flex-col items-center gap-1 text-sm">
    @for (item of links; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="bg-white/10 text-white border-logo" (click)="onNavigate()"
        [title]="item.label" [attr.aria-label]="item.label"
        class="h-11 w-11 flex items-center justify-center rounded-lg border-l-4 border-transparent text-white/80 hover:bg-white/10 transition-colors">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"/></svg>
      </a>
    }
  </nav>

  <!-- Bottom: signed-in admin · Log out (icon-only) -->
  <div class="w-full border-t border-white/10 py-3 flex flex-col items-center gap-1">
    @if (currentUser$ | async; as user) {
      <span [title]="user.displayName + ' · Administrator'"
        class="h-9 w-9 rounded-full bg-white/15 flex items-center justify-center text-xs font-semibold">{{ initials(user.displayName) }}</span>
    }
    <button type="button" (click)="logout()" title="Log out" aria-label="Log out"
      class="h-11 w-11 flex items-center justify-center rounded-lg bg-white/10 hover:bg-white/20 transition-colors">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    </button>
  </div>
</div>
