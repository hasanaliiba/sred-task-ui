<div class="h-full bg-gradient-to-b from-navy to-brand-900 text-white flex flex-col overflow-hidden">
  <!-- Brand -->
  <div class="h-16 shrink-0 flex items-center gap-3 pl-3.5 border-b border-white/10">
    <img src="assets/images/sredio-logo-2.jpeg" alt="SRED.IO" class="h-9 w-9 rounded-lg shrink-0" />
    <span class="text-base font-bold whitespace-nowrap opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-[.is-pinned]:opacity-100">SRED.IO</span>
  </div>

  <!-- Nav (icon rail; labels reveal when expanded — on hover or pinned) -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden py-4 px-2 flex flex-col gap-1 text-sm">
    @for (item of links; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="bg-white/10 text-white border-logo" (click)="onNavigate()"
        [title]="item.label" [attr.aria-label]="item.label"
        class="h-11 w-full flex items-center gap-3 rounded-lg border-l-4 border-transparent pl-3 pr-2 text-white/80 hover:bg-white/10 transition-colors">
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"/></svg>
        <span class="whitespace-nowrap opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-[.is-pinned]:opacity-100">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Bottom: collapse toggle · signed-in admin · Log out -->
  <div class="shrink-0 border-t border-white/10 py-3 px-2 flex flex-col gap-1">
    <button type="button" (click)="togglePinned()"
      [title]="(pinned$ | async) ? 'Collapse sidebar' : 'Keep sidebar open'" aria-label="Toggle sidebar"
      class="h-11 w-full flex items-center gap-3 rounded-lg pl-3 pr-2 text-white/70 hover:bg-white/10 transition-colors">
      <svg class="h-5 w-5 shrink-0 transition-transform duration-200" [class.rotate-180]="pinned$ | async" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
      <span class="whitespace-nowrap opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-[.is-pinned]:opacity-100">{{ (pinned$ | async) ? 'Collapse' : 'Keep open' }}</span>
    </button>

    @if (currentUser$ | async; as user) {
      <div class="h-11 flex items-center gap-3 px-1.5" [title]="user.displayName + ' · Administrator'">
        <span class="h-8 w-8 shrink-0 rounded-full bg-white/15 flex items-center justify-center text-xs font-semibold">{{ initials(user.displayName) }}</span>
        <span class="min-w-0 opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-[.is-pinned]:opacity-100">
          <span class="block text-sm font-medium leading-tight truncate">{{ user.displayName }}</span>
          <span class="block text-[11px] text-white/50 leading-tight">Administrator</span>
        </span>
      </div>
    }
    <button type="button" (click)="logout()" title="Log out" aria-label="Log out"
      class="h-11 w-full flex items-center gap-3 rounded-lg pl-3 pr-2 bg-white/10 hover:bg-white/20 transition-colors">
      <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      <span class="whitespace-nowrap opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-[.is-pinned]:opacity-100">Log out</span>
    </button>
  </div>
</div>
