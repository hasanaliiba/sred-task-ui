<div>
  <div class="mb-1">
    <h2 class="text-lg font-bold text-ink">Records</h2>
    <p class="text-sm text-gray-400">Browse and edit employees, invoices, teams, and projects.</p>
  </div>

  <!-- Tabs -->
  <div class="border-b border-gray-200 mb-4 flex gap-6 overflow-x-auto" role="tablist">
    @for (tab of tabs; track tab.key) {
      <button
        type="button"
        role="tab"
        (click)="select(tab.key)"
        [attr.aria-selected]="active === tab.key"
        class="py-2.5 text-sm font-medium border-b-2 -mb-px whitespace-nowrap transition-colors focus:outline-none"
        [class.border-brand-600]="active === tab.key"
        [class.text-brand-700]="active === tab.key"
        [class.border-transparent]="active !== tab.key"
        [class.text-gray-500]="active !== tab.key"
        [class.hover:text-gray-700]="active !== tab.key"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <!-- Active grid -->
  @switch (active) {
    @case ('employees') { <app-employee-grid></app-employee-grid> }
    @case ('invoices') { <app-invoice-grid></app-invoice-grid> }
    @case ('teams') { <app-team-grid></app-team-grid> }
    @case ('projects') { <app-project-grid></app-project-grid> }
  }
</div>
