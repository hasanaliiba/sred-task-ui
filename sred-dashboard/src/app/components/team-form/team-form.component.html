<div class="fixed inset-0 z-50 overflow-y-auto">
  <div class="flex min-h-full items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/40" (click)="onCancel()"></div>

    <!-- Dialog: capped height, scrollable body, sticky footer -->
    <div class="relative w-full max-w-md bg-white rounded-xl shadow-2xl flex flex-col max-h-[90vh]"
      role="dialog" aria-modal="true">
      <div class="px-6 pt-6 pb-3 shrink-0">
        <h2 class="text-lg font-bold text-ink">{{ isEdit ? 'Edit team' : 'Add team' }}</h2>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col min-h-0 flex-1">
        <div class="px-6 pb-2 overflow-y-auto space-y-4">
          <div>
            <label for="team-name" class="block mb-1 text-sm font-medium text-gray-700">Name</label>
            <input id="team-name" type="text" formControlName="name"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-300 focus:border-brand-500 outline-none"
              [class.border-danger]="nameInvalid" />
            @if (nameInvalid) { <p class="mt-1 text-xs text-danger">Name is required.</p> }
          </div>

          <div>
            <label for="team-color" class="block mb-1 text-sm font-medium text-gray-700">Color</label>
            <input id="team-color" type="color" formControlName="color"
              class="h-10 w-16 rounded border border-gray-300 cursor-pointer" />
          </div>

          <div>
            <p class="mb-1 text-sm font-medium text-gray-700">Members</p>
            @if (employees.length === 0) {
              <p class="text-xs text-gray-400">No employees to assign.</p>
            } @else {
              <div class="max-h-48 overflow-y-auto rounded-lg border border-gray-200 divide-y divide-gray-100">
                @for (e of employees; track e.id) {
                  <label class="flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer">
                    <input type="checkbox" [checked]="isSelected(e.id)" (change)="toggle(e.id)"
                      class="rounded border-gray-300 text-brand-600 focus:ring-brand-300" />
                    {{ e.name }}
                  </label>
                }
              </div>
              <p class="mt-1 text-xs text-gray-400">
                {{ selected.size }} selected · unchecking a member unassigns them from this team.
              </p>
            }
          </div>
        </div>

        <!-- Sticky footer -->
        <div class="px-6 py-4 border-t border-gray-100 shrink-0 flex justify-end gap-3 bg-white rounded-b-xl">
          <button type="button" (click)="onCancel()"
            class="text-sm text-gray-600 hover:bg-gray-100 rounded-lg px-4 py-2 transition-colors">Cancel</button>
          <button type="submit"
            class="text-sm text-white bg-brand-600 hover:bg-brand-700 rounded-lg px-4 py-2 transition-colors">
            {{ isEdit ? 'Save changes' : 'Add team' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
