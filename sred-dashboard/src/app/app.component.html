<!--
  S0 toolchain-proof page. Replaced by the routed shell in S5.
  Proves: Tailwind utilities, Flowbite component styling, and ApexCharts render.
-->
<main class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg ring-1 ring-gray-100 p-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-brand-700">{{ title }}</h1>
        <p class="text-sm text-gray-500">S0 — foundation &amp; tooling check</p>
      </div>
      <button
        type="button"
        class="text-white bg-brand-600 hover:bg-brand-700 focus:ring-4 focus:ring-brand-200 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors"
      >
        Flowbite button
      </button>
    </div>

    <apx-chart
      [series]="series"
      [chart]="chart"
      [xaxis]="xaxis"
      [dataLabels]="dataLabels"
      [plotOptions]="plotOptions"
    ></apx-chart>

    <p class="mt-6 text-xs text-gray-400">
      Tailwind + Flowbite + ApexCharts wired. Router, HttpClient, and animations
      providers registered.
    </p>
  </div>
</main>

<router-outlet></router-outlet>
