<!-- Mobile backdrop -->
@if (navOpen) {
  <div class="fixed inset-0 bg-black/40 z-30 lg:hidden" (click)="closeNav()"></div>
}

<!-- Sidebar (fixed; off-canvas on mobile) -->
<aside
  class="fixed z-40 inset-y-0 left-0 w-64 transition-transform duration-300 lg:translate-x-0"
  [class.-translate-x-full]="!navOpen"
  [class.translate-x-0]="navOpen"
>
  <app-sidebar (navigate)="closeNav()" (feedback)="feedbackOpen = true"></app-sidebar>
</aside>

<!-- Content column -->
<div class="lg:ml-64 flex flex-col min-h-screen">
  <!-- Mobile-only menu strip (desktop: the sidebar is always visible, so no top bar).
       The client identity now lives in the blue <app-client-header> on each page. -->
  <div class="lg:hidden sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200">
    <div class="h-14 px-3 flex items-center">
      <button type="button" (click)="openNav()"
        class="h-10 w-10 -ml-1 rounded-md hover:bg-gray-100 flex items-center justify-center"
        aria-label="Open navigation">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <main class="flex-1 p-4">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Feedback modal (opened from the sidebar) -->
<app-feedback-modal [open]="feedbackOpen" (close)="feedbackOpen = false"></app-feedback-modal>
